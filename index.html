<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparta Superior: The Agoge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <header id="stats-header">
            <div class="stat">DISCIPLINE: <span id="stat-discipline">10</span></div>
            <div class="stat">STRENGTH: <span id="stat-strength">10</span></div>
            <div class="stat">SPIRIT: <span id="stat-spirit">10</span></div>
        </header>

        <div id="canvas-container">
            <canvas id="game-canvas"></canvas>

            <!-- Menu Overlay -->
            <div id="menu-overlay" class="overlay">
                <h1>SPARTA SUPERIOR</h1>
                <p>Prove your worth in the Agoge and show the world why Athens is a city of soft poets while Sparta is a city of iron men.</p>
                <button class="spartan-btn" onclick="game.setState('AGOGE')">ENTER THE AGOGE</button>
            </div>

            <!-- Dialogue Overlay (Debate & Narrative) -->
            <div id="dialogue-overlay" class="overlay" style="display: none;">
                <div id="mentor-section">
                    <h3 id="mentor-name">Lycurgus</h3>
                    <p id="mentor-text">"A Spartan's shield is his city's wall."</p>
                </div>
                <div id="narrative-section">
                    <p id="narrative-text"></p>
                    <div id="choices-container"></div>
                </div>
                <!-- Influence Meter for Debate -->
                <div id="influence-meter-container" style="display: none;">
                    <div id="influence-label">SPARTAN LOGIC</div>
                    <div id="influence-bar-bg">
                        <div id="influence-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Result Overlay -->
            <div id="result-overlay" class="overlay" style="display: none;">
                <h2 id="result-title">VALOR RECORDED</h2>
                <p id="result-text"></p>
                <button class="spartan-btn" onclick="location.reload()">REBORN IN SPARTA</button>
            </div>
        </div>

        <footer>
            <p>LACEDAEMON • 480 BC</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
